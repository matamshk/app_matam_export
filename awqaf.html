<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أوقات الصلاة والقبلة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home-theme.css">
    <style>
        /* Awqaf Specific Styles */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .awqaf-card {
            background: linear-gradient(145deg, #162444, #0f172a);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .awqaf-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), transparent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.25rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Prayer Times List */
        .prayer-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .prayer-row:last-child {
            border-bottom: none;
        }

        .prayer-row.next-prayer {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin: 5px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Compass */
        .compass-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 4px solid var(--text-muted);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .compass-arrow {
            width: 4px;
            height: 90px;
            background: red;
            position: absolute;
            top: 10px;
            left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%);
            transition: transform 0.5s ease-out;
        }

        .kaaba-icon {
            font-size: 2rem;
            color: var(--primary-color);
        }

        /* Date Badge */
        .date-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        /* Controls */
        .location-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: #000;
        }
        @media print {
            body * { visibility: hidden; }
            #printCalendarArea, #printCalendarArea * { visibility: visible; color: black; }
            #printCalendarArea { position: absolute; left: 0; top: 0; width: 100%; display: block; border: none; padding: 0; }
            #printCalendarArea button { display: none !important; }
            table { border-collapse: collapse; width: 100%; border: 1px solid #333; }
            th, td { border: 1px solid #333 !important; padding: 8px !important; color: black !important; }
            th { background-color: #eee !important; }
        }
    </style>
</head>

<body>

    <nav class="navbar" style="background: transparent; box-shadow: none; position: absolute; width: 100%; top: 0; z-index: 10;">
        <div class="container nav-content">
            <a href="index.html" class="logo" style="color: #1E3C72;"><i class="fas fa-mosque"></i> بوابة المأتم</a>
            <div class="menu-toggle"><i class="fas fa-bars" style="color: #1E3C72;"></i></div>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <header class="hero-section">
        <div style="height: 40px;"></div>
        <div class="city-display"><i class="fas fa-clock" style="font-size: 0.7em;"></i> مواقيت الصلاة والتقويم</div>
        <div class="date-display" id="headerDateDisplay" style="position: relative;">--</div>
        <div style="margin-top: 10px;">
            <!-- Offset buttons removed -->
        </div>
    </header>

    <div class="container" style="margin-top: -30px; position: relative; z-index: 5;">
        <div class="location-controls" style="background: var(--bg-card); padding: 15px; border-radius: 12px; box-shadow: var(--shadow);">
            <button id="locateBtn" class="btn"><i class="fas fa-map-marker-alt"></i> تحديد موقعي</button>
            <select id="citySelect" style="width: auto; flex-grow: 1;">
                <option value="auto">تلقائي (GPS)</option>
                <option value="26.2285,50.5860">مملكة البحرين</option>
                <option value="24.7136,46.6753">الرياض، السعودية</option>
                <option value="29.3759,47.9774">الكويت، الكويت</option>
                <option value="25.2048,55.2708">دبي، الإمارات</option>
                <option value="33.3152,44.3661">بغداد، العراق</option>
            </select>
        </div>

        <div class="dashboard-grid" id="awqafDashboard">

            <!-- Card 1: Today's Prayers -->
            <div class="awqaf-card" id="prayersCard">
                <div class="card-header">
                    <div class="card-title"><i class="far fa-clock"></i> مواقيت الصلاة</div>
                    <button class="btn-sm btn-outline" onclick="shareCard('prayersCard')"><i
                            class="fas fa-share-alt"></i></button>
                </div>

                <div id="prayerList" style="margin-top: 10px;">
                    <!-- Injected by JS -->
                    <div class="text-center"><i class="fas fa-spinner fa-spin"></i> جاري الحساب...</div>
                </div>

                <div style="margin-top: 15px; text-align: center; font-size: 0.9rem; color: var(--success);">
                    <i class="fas fa-mosque"></i> الصلاة القادمة: <span id="nextPrayerName">--</span> (<span
                        id="nextPrayerTime">--</span>)
                </div>
            </div>

        </div>

        <div class="monthly-calendar-section" id="printCalendarArea" style="margin-top: 40px; background: linear-gradient(145deg, #162444, #0f172a); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
                <h3 style="color: #e2e8f0; font-size: 1.5rem; margin: 0; font-weight: bold;"><i class="fas fa-calendar-alt" style="color: var(--gold-primary); margin-left: 8px;"></i> تقويم أوقات الصلاة للشهر الحالي</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <a id="prayerRefDownloadBtn" href="#" target="_blank" class="btn" style="display: none; background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); border-radius: 12px; padding: 10px 15px; text-decoration: none; align-items: center; gap: 5px; font-weight: bold; transition: all 0.3s ease;" onmouseover="this.style.background='#2ecc71'; this.style.color='#fff';" onmouseout="this.style.background='rgba(46, 204, 113, 0.15)'; this.style.color='#2ecc71';"><i class="fas fa-file-download"></i> تحميل جدول الأوقات المعتمد (PDF/صورة)</a>
                    <button class="btn" style="background: rgba(212, 175, 55, 0.15); color: var(--gold-primary); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; transition: all 0.3s ease;" onmouseover="this.style.background='var(--gold-primary)'; this.style.color='#000';" onmouseout="this.style.background='rgba(212, 175, 55, 0.15)'; this.style.color='var(--gold-primary)';" onclick="printMonthlyCalendar()"><i class="fas fa-print"></i> تحميل / طباعة التقويم</button>
                </div>
            </div>

            <div style="overflow-x: auto; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                <table style="width: 100%; border-collapse: collapse; text-align: center; font-size: 0.95rem; background: rgba(0,0,0,0.2);">
                    <thead>
                        <tr style="background: rgba(255,255,255,0.05); color: #ffffff; border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <th style="padding: 16px 8px; font-weight: bold; width: 60px;">اليوم</th>
                            <th style="padding: 16px 8px; font-weight: bold; width: 60px;">الميلادي</th>
                            <th style="padding: 16px 8px; font-weight: bold; width: 60px;">الهجري</th>
                            <th style="padding: 16px 8px; font-weight: bold; color: var(--gold-primary);">الإمساك</th>
                            <th style="padding: 16px 8px; font-weight: bold;">الفجر</th>
                            <th style="padding: 16px 8px; font-weight: bold;">الشروق</th>
                            <th style="padding: 16px 8px; font-weight: bold;">الزوال</th>
                            <th style="padding: 16px 8px; font-weight: bold;">العصر</th>
                            <th style="padding: 16px 8px; font-weight: bold;">المغرب</th>
                            <th style="padding: 16px 8px; font-weight: bold;">العشاء</th>
                            <th style="padding: 16px 8px; font-weight: bold; color: #94a3b8;">المنتصف</th>
                        </tr>
                    </thead>
                    <tbody id="monthlyPrayerTableBody">
                        <tr><td colspan="7" style="padding: 20px;">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="js/adhan_fixed.js"></script>

    <script src="js/main.js?v=2026"></script>
    <script src="js/awqaf.js?v=3"></script>
</body>

</html>
