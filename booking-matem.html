<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز المأتم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-section {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-section h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .custom-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: var(--text-light);
            margin: 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .custom-option:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }
        .custom-option input[type="radio"],
        .custom-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
            margin: 0;
        }
        .custom-option span {
            flex: 1;
            text-align: right;
            font-weight: 500;
        }
        .option-with-input {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            gap: 15px;
        }
        .option-with-input:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.3);
        }
        .option-with-input label {
            margin: 0;
            color: var(--text-light);
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        .option-with-input label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
            margin: 0;
        }
        .option-with-input input[type="number"] {
            width: 80px;
            padding: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border-radius: 6px;
            font-family: var(--font-main);
            transition: border-color 0.3s;
        }
        .option-with-input input[type="number"]:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        
        select {
            text-align: right;
            text-align-last: right;
            direction: rtl;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 1rem center;
            background-size: 1em;
            padding-left: 2.5rem;
            cursor: pointer;
        }
        select option {
            text-align: right;
            direction: rtl;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-mosque"></i> بوابة المأتم</a>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">حجز المأتم للمناسبات</h2>

        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <form id="bookingForm">
                <div class="form-group">
                    <label>الاسم الثلاثي</label>
                    <input type="text" name="name" required placeholder="ادخل اسمك الكامل">
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" name="phone" required placeholder="33XXXXXX">
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label>التاريخ</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>الوقت</label>
                        <select name="time" required>
                            <option value="">اختر الفترة...</option>
                            <option value="الصباح">الصباح</option>
                            <option value="الظهر">الظهر</option>
                            <option value="العصر">العصر</option>
                            <option value="المساء">المساء</option>
                        </select>
                    </div>
                </div>

                <!-- 1. Event Type -->
                <div class="form-section">
                    <h3><i class="fas fa-calendar-check"></i> 1. نوع الفعالية ومسمى الحجز</h3>
                    <div class="options-grid">
                        <label class="custom-option"><input type="radio" name="service" value="عقد قران" required> <span>عقد قران</span></label>
                        <label class="custom-option"><input type="radio" name="service" value="خطوبة نساء"> <span>خطوبة نساء</span></label>
                        <label class="custom-option"><input type="radio" name="service" value="محاضرة"> <span>محاضرة</span></label>
                        <label class="custom-option"><input type="radio" name="service" value="جلسة شبابية"> <span>جلسة شبابية</span></label>
                        <label class="custom-option"><input type="radio" name="service" value="برنامج نسائي"> <span>برنامج نسائي</span></label>
                        <label class="custom-option"><input type="radio" name="service" value="برامج أخرى"> <span>برامج أخرى</span></label>
                    </div>
                </div>

                <!-- 2. Halls -->
                <div class="form-section">
                    <h3><i class="fas fa-building"></i> 2. الصالات (الموقع)</h3>
                    <div class="options-grid">
                        <label class="custom-option"><input type="radio" name="hall" value="الصالة الأرضية" required> <span>الصالة الأرضية</span></label>
                        <label class="custom-option"><input type="radio" name="hall" value="الصالة العلوية"> <span>الصالة العلوية</span></label>
                        <label class="custom-option"><input type="radio" name="hall" value="المأتم بالكامل"> <span>المأتم بالكامل</span></label>
                    </div>
                </div>

                <!-- 3. Base Services Packages -->
                <div class="form-section">
                    <h3><i class="fas fa-concierge-bell"></i> 3. الخدمات (باقة الحجز)</h3>
                    <div class="options-grid" style="grid-template-columns: 1fr;">
                        <label class="custom-option"><input type="radio" name="package" value="حجز كامل يشمل الطاقم والتنظيف والمسرح" required> <span>حجز كامل يشمل الطاقم والتنظيف والمسرح</span></label>
                        <label class="custom-option"><input type="radio" name="package" value="حجز مع المسرح والتنظيف"> <span>حجز مع المسرح والتنظيف</span></label>
                        <label class="custom-option"><input type="radio" name="package" value="حجز مع التنظيف"> <span>حجز مع التنظيف</span></label>
                        <label class="custom-option"><input type="radio" name="package" value="حجز تنظيف مع الطقم"> <span>حجز تنظيف مع الطقم</span></label>
                    </div>
                </div>

                <!-- 4. Additional Services -->
                <div class="form-section">
                    <h3><i class="fas fa-plus-circle"></i> 4. اختيار الخدمات الإضافية</h3>
                    
                    <div class="options-grid">
                        <div class="option-with-input">
                            <label><input type="checkbox" name="has_tables"> <span>طاولات</span></label>
                            <input type="number" name="tables_count" placeholder="العدد" min="1">
                        </div>
                        
                        <div class="option-with-input">
                            <label><input type="checkbox" name="has_chairs"> <span>كراسي</span></label>
                            <input type="number" name="chairs_count" placeholder="العدد" min="1">
                        </div>

                        <label class="custom-option"><input type="checkbox" name="has_tea" value="نعم"> <span>الشاي</span></label>
                        <label class="custom-option"><input type="checkbox" name="has_coffee" value="نعم"> <span>القهوة</span></label>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <label style="color: var(--text-muted); display: block; margin-bottom: 8px;">خدمات أخرى وملاحظات</label>
                        <textarea name="other_services" rows="3" placeholder="أكتب تفاصيل الخدمات الأخرى الإضافية إن وجدت..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-block">تأكيد الحجز</button>
            </form>
        </div>
    </div>

    <a href="#" class="whatsapp-float" id="whatsapp-float"><i class="fab fa-whatsapp"></i></a>
    <script src="js/adhan_fixed.js"></script>
    <script src="js/occasions-data.js"></script>
    <script src="js/main.js?v=2026"></script>
</body>

</html>
