<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل المناسبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-mosque"></i> بوابة المأتم</a>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">دليل المناسبات الدينية</h2>

        <!-- Controls Section -->
        <div class="controls-section"
            style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 15px; border-radius: 8px; border: var(--glass-border);">

            <div style="display: flex; gap: 10px; align-items: center;">
                <label for="hijriYearSelect" style="margin:0; color: var(--primary-color); font-weight: bold;">السنة
                    الهجرية:</label>
                <select id="hijriYearSelect" style="width: auto; padding: 8px; min-width: 120px;">
                    <!-- Populated by JS -->
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <button onclick="window.print()" class="btn" style="background: #6c757d; color: white;">
                    <i class="fas fa-print"></i> طباعة / PDF
                </button>
                <button id="exportExcelBtn" class="btn" style="background: #28a745; color: white;">
                    <i class="fas fa-file-excel"></i> Excel
                </button>
                <button id="addEventBtn" class="btn">
                    <i class="fas fa-plus"></i> إضافة مناسبة
                </button>
            </div>
        </div>

        <!-- Add Event Modal -->
        <div id="addEventModal" class="modal hidden"
            style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; display: none;">
            <div class="modal-content"
                style="background: var(--bg-card); padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid var(--primary-color);">
                <h3 style="color: var(--primary-color); margin-bottom: 15px; text-align: center;">إضافة مناسبة جديدة
                </h3>
                <form id="newEventForm">
                    <div class="form-group">
                        <label>عنوان المناسبة</label>
                        <input type="text" name="title" required>
                    </div>
                    <div class="form-group" style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label>الشهر</label>
                            <select name="month" required>
                                <option value="1">محرم</option>
                                <option value="2">صفر</option>
                                <option value="3">ربيع الأول</option>
                                <option value="4">ربيع الثاني</option>
                                <option value="5">جمادى الأولى</option>
                                <option value="6">جمادى الآخرة</option>
                                <option value="7">رجب</option>
                                <option value="8">شعبان</option>
                                <option value="9">رمضان</option>
                                <option value="10">شوال</option>
                                <option value="11">ذو القعدة</option>
                                <option value="12">ذو الحجة</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label>اليوم</label>
                            <input type="number" name="day" min="1" max="30" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>النوع</label>
                        <select name="type">
                            <option value="religious">ديني (عام)</option>
                            <option value="happy">ميلاد / عيد (سعيد)</option>
                            <option value="sad">وفاة / استشهاد (حزين)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الوصف</label>
                        <textarea name="description" rows="3"
                            style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white;"></textarea>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn"
                            onclick="document.getElementById('addEventModal').style.display='none'"
                            style="background: #dc3545; flex: 1;">إلغاء</button>
                        <button type="submit" class="btn" style="flex: 1;">حفظ</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="occasions-container">
            <!-- Injected by JS -->
            <div class="text-center">
                <i class="fas fa-spinner fa-spin"></i> جاري التحميل...
            </div>
        </div>
    </div>

    <a href="#" class="whatsapp-float" id="whatsapp-float"><i class="fab fa-whatsapp"></i></a>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/adhan_fixed.js"></script>
    <script src="js/occasions-data.js"></script>
    <script src="js/main.js?v=2026"></script>
</body>

</html>
