<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز الخطباء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-mosque"></i> بوابة المأتم</a>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">حجز الخطباء</h2>

        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <form id="speakerForm">
                <div class="form-group">
                    <label>الاسم</label>
                    <input type="text" name="name" required placeholder="اسم جهة الحجز">
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" name="phone" required>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label>التاريخ</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>الفترة</label>
                        <select name="time" required>
                            <option value="">اختر الفترة...</option>
                            <option value="الصباح">الصباح</option>
                            <option value="الظهر">الظهر</option>
                            <option value="العصر">العصر</option>
                            <option value="المساء">المساء</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>الوقت المحدد (اختياري)</label>
                    <input type="time" name="time_specific">
                </div>

                <div class="form-group">
                    <label>نوع الفعالية</label>
                    <select name="event_type" required>
                        <option value="">اختر...</option>
                        <option value="وفاة">وفاة</option>
                        <option value="مولد">مولد</option>
                        <option value="مجلس حسيني">مجلس حسيني</option>
                        <option value="مجلس تعزية (فاتحة)">مجلس تعزية (فاتحة)</option>
                        <option value="مجلس تأبين">مجلس تأبين</option>
                    </select>
                </div>

                <div class="form-group" id="occasionContainer" style="display: none; background: rgba(212,175,55,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2); margin-top: 15px;">
                    <label style="color: var(--gold-primary);"><i class="fas fa-list-alt"></i> القائمة المسندة للمناسبة</label>
                    <select name="service" id="occasionSelect" style="border-color: var(--gold-primary);">
                        <option value="">اختر المناسبة...</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-block" style="margin-top: 20px;">تأكيد طلب الخطيب</button>
            </form>
        </div>
    </div>

    <a href="#" class="whatsapp-float" id="whatsapp-float"><i class="fab fa-whatsapp"></i></a>
    <script src="js/adhan_fixed.js"></script>
    <script src="js/occasions-data.js"></script>
    <script src="js/main.js?v=2026"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const wafatList = [
                "حادي محرم", "السابع", "الثامن", "تاسوعاء", "عاشوراء", "الحادي عشر",
                "استشهاد الإمام علي بن الحسين السجاد (ع)", "استشهاد الإمام الحسن المجتبى (ع)", "استشهاد الإمام الرضا (ع)",
                "ذكرى الأربعين", "وفاة السيدة مريم بنت عمران (ع)", "استشهاد أولاد مسلم بن عقيل (ع)",
                "استشهاد النبي يحيى (ع)", "استشهاد الرسول الأعظم (ص)", "ذكرى تسقيط الزهراء (ع)",
                "استشهاد الإمام الحسن العسكري", "وفاة السيدة المعصومة (ع)", "استشهاد السيدة فاطمة الزهراء (ع)",
                "وفاة القاسم ابن الإمام الكاظم (ع)", "استشهاد السيدة فاطمة الزهراء (ع) رواية", "وفاة السيدة أم البنين (ع)",
                "استشهاد الإمام الهادي (ع)", "وفاة السيدة زينب (ع)", "استشهاد الإمام الكاظم (ع)",
                "غرة شهر رمضان المبارك", "جرح أمير المؤمنين (ع)", "وصية أمير المؤمنين (ع)",
                "استشهاد أمير المؤمنين (ع)", "استشهاد الإمام جعفر الصادق (ع)", "استشهاد الإمام محمد الجواد (ع)",
                "استشهاد الإمام محمد الباقر (ع)", "خروج الإمام الحسين (ع) / حرم الحجاج"
            ];

            const mawlidList = [
                "مولد الرسول الأعظم (ص) والإمام الصادق (ع)", "مولد الإمام الحسن العسكري (ع)", "مولد السيدة زينب (ع)",
                "مولد السيدة فاطمة الزهراء (ع)", "مولد الإمام محمد الباقر (ع)", "مولد الإمام علي الهادي (ع)",
                "مولد الإمام محمد الجواد (ع)", "مولد الإمام علي (ع)", "المبعث النبوي الشريف",
                "مولد الإمام الحسين (ع)", "مولد العباس (ع)", "مولد الإمام السجاد (ع)",
                "مولد الأكبر (ع)", "مولد الإمام الحجة (عج)", "مولد الإمام الحسن المجتبى (ع)",
                "مولد السيدة المعصومة", "مولد الإمام علي بن موسى الرضا (ع)", "عيد الغدير",
                "مولد الإمام الكاظم (ع)", "المباهلة وتصدق أمير المؤمنين (ع) بالخاتم"
            ];

            const eventTypeSelect = document.querySelector('select[name="event_type"]');
            const occContainer = document.getElementById('occasionContainer');
            const occSelect = document.getElementById('occasionSelect');

            eventTypeSelect.addEventListener('change', (e) => {
                const val = e.target.value;
                occSelect.innerHTML = '<option value="">اختر المناسبة...</option>';
                
                if (val === 'وفاة') {
                    wafatList.forEach(item => occSelect.innerHTML += '<option value="' + item + '">' + item + '</option>');
                    occContainer.style.display = 'block';
                    occSelect.required = true;
                } else if (val === 'مولد') {
                    mawlidList.forEach(item => occSelect.innerHTML += '<option value="' + item + '">' + item + '</option>');
                    occContainer.style.display = 'block';
                    occSelect.required = true;
                } else {
                    occContainer.style.display = 'none';
                    occSelect.required = false;
                    occSelect.value = '';
                }
            });
        });
    </script>
</body>

</html>
