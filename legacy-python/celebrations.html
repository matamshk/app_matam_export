<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاحتفالات والفعاليات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-mosque"></i> بوابة المأتم</a>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">تنظيم الاحتفالات والفعاليات</h2>

        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <form id="celebrationForm">
                <div class="form-group">
                    <label>اسم المنظم</label>
                    <input type="text" name="name" required>
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" name="phone" required>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label>تاريخ الفعالية</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>الفترة</label>
                        <select name="time" required>
                            <option value="">اختر الفترة...</option>
                            <option value="الصباح">الصباح</option>
                            <option value="الظهر">الظهر</option>
                            <option value="العصر">العصر</option>
                            <option value="المساء">المساء</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>الوقت المحدد (اختياري)</label>
                    <input type="time" name="time_specific">
                </div>

                <div class="form-group">
                    <label>نوع المناسبة</label>
                    <select name="occasion_type" required>
                        <option value="">اختر...</option>
                        <option value="المولد">المولد</option>
                        <option value="محاضرة">محاضرة</option>
                        <option value="جلسة شبابية">جلسة شبابية</option>
                        <option value="برنامج نسائي">برنامج نسائي</option>
                        <option value="برنامج آخر">برنامج آخر</option>
                    </select>
                </div>

                <div class="form-group" id="occasionContainer" style="display: none; background: rgba(212,175,55,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2); margin-top: 15px; margin-bottom: 20px;">
                    <label style="color: var(--gold-primary);"><i class="fas fa-list-alt"></i> القائمة المسندة للمولد</label>
                    <select name="service" id="occasionSelect" style="border-color: var(--gold-primary);">
                        <option value="">اختر المولد...</option>
                    </select>
                </div>

                <fieldset
                    style="border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <legend style="color: var(--primary-color); padding: 0 10px;">تفاصيل المشاركين</legend>

                    <div class="bookings-list">
                        <div>
                            <label>الخطيب</label>
                            <input type="text" name="participant_khatib">
                        </div>
                        <div>
                            <label>قارئ القرآن</label>
                            <input type="text" name="participant_quran">
                        </div>
                        <div>
                            <label>الكلمة</label>
                            <input type="text" name="participant_speech">
                        </div>
                        <div>
                            <label>الشعر</label>
                            <input type="text" name="participant_poet">
                        </div>
                        <div>
                            <label>الأهازيج / الرادود</label>
                            <input type="text" name="participant_radod">
                        </div>
                        <div>
                            <label>تعريف الحفل</label>
                            <input type="text" name="participant_intro">
                        </div>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label>حجز القاعة والمرافق</label>
                    <select name="hall_details" required>
                        <option value="الصالة العلوية">الصالة العلوية</option>
                        <option value="الصالة الأرضية">الصالة الأرضية</option>
                        <option value="المأتم بالكامل">المأتم بالكامل</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>إضافات</label>
                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <label style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" name="services" value="cleaning" style="width: auto;"> التنظيف
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" name="services" value="stage" style="width: auto;"> المسرح
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" name="services" value="food" style="width: auto;"> الطعام
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-block">تسجيل الفعالية</button>
            </form>
        </div>
    </div>

    <a href="#" class="whatsapp-float" id="whatsapp-float"><i class="fab fa-whatsapp"></i></a>
    <script src="js/adhan_fixed.js"></script>
    <script src="js/occasions-data.js"></script>
    <script src="js/main.js?v=2026"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mawlidList = [
                "مولد الرسول الأعظم (ص) والإمام الصادق (ع)", "مولد الإمام الحسن العسكري (ع)", "مولد السيدة زينب (ع)",
                "مولد السيدة فاطمة الزهراء (ع)", "مولد الإمام محمد الباقر (ع)", "مولد الإمام علي الهادي (ع)",
                "مولد الإمام محمد الجواد (ع)", "مولد الإمام علي (ع)", "المبعث النبوي الشريف",
                "مولد الإمام الحسين (ع)", "مولد العباس (ع)", "مولد الإمام السجاد (ع)",
                "مولد الأكبر (ع)", "مولد الإمام الحجة (عج)", "مولد الإمام الحسن المجتبى (ع)",
                "مولد السيدة المعصومة", "مولد الإمام علي بن موسى الرضا (ع)", "عيد الغدير",
                "مولد الإمام الكاظم (ع)", "المباهلة وتصدق أمير المؤمنين (ع) بالخاتم"
            ];

            const occTypeSelect = document.querySelector('select[name="occasion_type"]');
            const occContainer = document.getElementById('occasionContainer');
            const occSelect = document.getElementById('occasionSelect');

            if(occTypeSelect) {
                occTypeSelect.addEventListener('change', (e) => {
                    const val = e.target.value;
                    occSelect.innerHTML = '<option value="">اختر المولد...</option>';
                    
                    if (val === 'المولد') {
                        mawlidList.forEach(item => occSelect.innerHTML += '<option value="' + item + '">' + item + '</option>');
                        occContainer.style.display = 'block';
                        occSelect.required = true;
                    } else {
                        occContainer.style.display = 'none';
                        occSelect.required = false;
                        occSelect.value = '';
                    }
                });
            }
        });
    </script>
</body>

</html>
