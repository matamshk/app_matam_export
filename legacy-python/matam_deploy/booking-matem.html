<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز المأتم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-mosque"></i> بوابة المأتم</a>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">حجز المأتم للمناسبات</h2>

        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <form id="bookingForm">
                <div class="form-group">
                    <label>الاسم الثلاثي</label>
                    <input type="text" name="name" required placeholder="ادخل اسمك الكامل">
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" name="phone" required placeholder="33XXXXXX">
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label>التاريخ</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>الوقت</label>
                        <select name="time" required>
                            <option value="">اختر الفترة...</option>
                            <option value="الصباح">الصباح</option>
                            <option value="الظهر">الظهر</option>
                            <option value="العصر">العصر</option>
                            <option value="المساء">المساء</option>
                        </select>
                    </div>
                </div>

                <!-- 1. Event Type -->
                <div class="form-section" style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(212,175,55,0.2);">
                    <h3 style="color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;"><i class="fas fa-calendar-check"></i> 1. نوع الفعالية ومسمى الحجز</h3>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="service" value="عقد قران" required> عقد قران</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="service" value="خطوبة نساء"> خطوبة نساء</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="service" value="محاضرة"> محاضرة</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="service" value="جلسة شبابية"> جلسة شبابية</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="service" value="برنامج نسائي"> برنامج نسائي</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="service" value="برامج أخرى"> برامج أخرى</label>
                    </div>
                </div>

                <!-- 2. Halls -->
                <div class="form-section" style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(212,175,55,0.2);">
                    <h3 style="color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;"><i class="fas fa-building"></i> 2. الصالات (الموقع)</h3>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="hall" value="الصالة الأرضية" required> الصالة الأرضية</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="hall" value="الصالة العلوية"> الصالة العلوية</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;"><input type="radio" name="hall" value="المأتم بالكامل"> المأتم بالكامل</label>
                    </div>
                </div>

                <!-- 3. Base Services Packages -->
                <div class="form-section" style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(212,175,55,0.2);">
                    <h3 style="color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;"><i class="fas fa-concierge-bell"></i> 3. الخدمات (باقة الحجز)</h3>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;"><input type="radio" name="package" value="حجز كامل يشمل الطاقم والتنظيف والمسرح" required> حجز كامل يشمل الطاقم والتنظيف والمسرح</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;"><input type="radio" name="package" value="حجز مع المسرح والتنظيف"> حجز مع المسرح والتنظيف</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;"><input type="radio" name="package" value="حجز مع التنظيف"> حجز مع التنظيف</label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-light); margin: 0; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;"><input type="radio" name="package" value="حجز تنظيف مع الطقم"> حجز تنظيف مع الطقم</label>
                    </div>
                </div>

                <!-- 4. Additional Services -->
                <div class="form-section" style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(212,175,55,0.2);">
                    <h3 style="color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;"><i class="fas fa-plus-circle"></i> 4. اختيار الخدمات الإضافية</h3>
                    
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;">
                            <label style="margin: 0; color: var(--text-light); cursor: pointer; flex: 1; display:flex; align-items:center;"><input type="checkbox" name="has_tables" style="width: auto; margin-left: 10px;"> طاولات</label>
                            <input type="number" name="tables_count" placeholder="العدد" min="1" style="width: 80px; padding: 5px; text-align: center; border: 1px solid #444; background: #222; color: #fff; border-radius: 4px;">
                        </div>
                        
                        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;">
                            <label style="margin: 0; color: var(--text-light); cursor: pointer; flex: 1; display:flex; align-items:center;"><input type="checkbox" name="has_chairs" style="width: auto; margin-left: 10px;"> كراسي</label>
                            <input type="number" name="chairs_count" placeholder="العدد" min="1" style="width: 80px; padding: 5px; text-align: center; border: 1px solid #444; background: #222; color: #fff; border-radius: 4px;">
                        </div>

                        <div style="display: flex; align-items: center; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;">
                            <label style="margin: 0; color: var(--text-light); cursor: pointer; width: 100%; display:flex; align-items:center;"><input type="checkbox" name="has_tea" value="نعم" style="width: auto; margin-left: 10px;"> الشاي</label>
                        </div>

                        <div style="display: flex; align-items: center; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px;">
                            <label style="margin: 0; color: var(--text-light); cursor: pointer; width: 100%; display:flex; align-items:center;"><input type="checkbox" name="has_coffee" value="نعم" style="width: auto; margin-left: 10px;"> القهوة</label>
                        </div>
                    </div>
                    
                    <div style="margin-top: 15px;">
                        <label style="color: var(--text-muted); display: block; margin-bottom: 8px;">خدمات أخرى وملاحظات</label>
                        <textarea name="other_services" rows="3" placeholder="أكتب تفاصيل الخدمات الأخرى الإضافية إن وجدت..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-block">تأكيد الحجز</button>
            </form>
        </div>
    </div>

    <a href="#" class="whatsapp-float" id="whatsapp-float"><i class="fab fa-whatsapp"></i></a>
    <script src="js/main.js?v=2026"></script>
</body>

</html>
